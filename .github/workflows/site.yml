name: Deploy Site
on:
  release:
    types: [published]
  workflow_dispatch:

# Explicit permissions following principle of least privilege
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for git-revision-date-localized plugin

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun (runtime)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install MkDocs dependencies
        run: pip install -r docs/requirements-docs.txt

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild docs
        run: bash scripts/docs-prebuild.sh

      - name: Build MkDocs
        run: mkdocs build

      - name: Build Ladle
        run: pnpm --filter @vamsa/web ladle:build

      - name: Finalize site
        run: touch docs/site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
