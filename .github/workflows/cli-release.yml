name: CLI Release
run-name: "CLI release · ${{ github.ref_name }}"

# Build standalone `vamsa` binaries and attach them to a GitHub release.
# Trigger: push a tag like cli-v0.2.0 (the version must match apps/cli/package.json).

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing cli-v* tag to (re)build and attach"
        required: true

permissions:
  contents: read

# One release run per tag, whether triggered by the push or by dispatch
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Validate tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^cli-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a cli-vX.Y.Z tag"
            exit 1
          fi
          # Must be an existing tag, not a branch with the same name
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  test:
    name: CLI tests
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches package version
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          if [ "${TAG#cli-v}" != "$version" ]; then
            echo "::error::tag $TAG does not match apps/cli/package.json version $version"
            exit 1
          fi

      - name: Typecheck and test
        run: |
          pnpm --filter @vamsa/cli typecheck
          pnpm --filter @vamsa/cli test

  build:
    name: Build ${{ matrix.target }}
    needs: [resolve, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @vamsa/cli...

      - name: Build binary
        working-directory: apps/cli
        run: bun scripts/build.ts ${{ matrix.target }}

      # Each runner matches its target, so the binary can be smoke-tested
      - name: Smoke test
        working-directory: apps/cli
        run: |
          ./dist/vamsa-${{ matrix.target }} --version
          ./dist/vamsa-${{ matrix.target }} --help > /dev/null
          set +e
          ./dist/vamsa-${{ matrix.target }} --no-such-flag > /dev/null
          code=$?
          set -e
          test "$code" -eq 2

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vamsa-${{ matrix.target }}
          path: apps/cli/dist/vamsa-${{ matrix.target }}
          if-no-files-found: error

  release:
    name: Attach to release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: bin
          merge-multiple: true

      - name: Checksums
        working-directory: bin
        run: sha256sum vamsa-* > SHA256SUMS && cat SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" bin/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" bin/* --repo "$GITHUB_REPOSITORY" \
              --title "vamsa CLI ${TAG#cli-v}" \
              --notes "Standalone \`vamsa\` binaries. Download the one for your platform, \`chmod +x\` it and put it on your PATH. Verify with SHA256SUMS."
          fi
